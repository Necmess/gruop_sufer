<main id="view-home" class="view active">
  <section class="hero" id="home">
    <video class="hero-video" autoplay muted loop playsinline preload="auto">
      <source src="videos/wave.mp4" type="video/mp4">
    </video>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <p class="hero-eyebrow">국내 서핑 스팟 · 오늘의 컨디션</p>
      <h1>오늘,<br>어디서 서핑할까요?</h1>
      <p class="hero-sub">파고와 바람을 기준으로 오늘 타기 좋은 스팟을 찾아보세요.</p>
      <div class="hero-cta">
        <a href="#spots" class="btn btn-primary btn-lg" data-scroll="spots">스팟 둘러보기</a>
        <button class="btn btn-ghost btn-lg" id="openLessonHero">초보자 레슨 보기</button>
      </div>
    </div>
  </section>

  <section class="today-highlight">
    <div class="section-inner">
      <div class="today-card recommend" id="todayRecommend"><span class="today-tag">오늘 가장 좋은 곳</span><div class="today-body loading-skel">불러오는 중...</div></div>
      <div class="today-card avoid" id="todayAvoid"><span class="today-tag">오늘은 잠시 쉬어가기</span><div class="today-body loading-skel">불러오는 중...</div></div>
      <div class="today-card nearby" id="todayNearby">
        <span class="today-tag">내 위치와 가까운 곳</span>
        <div class="today-body" id="todayNearbyBody">
          <button type="button" class="today-locate-btn" id="todayNearbyLocateBtn"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><line x1="12" y1="2" x2="12" y2="5"></line><line x1="12" y1="19" x2="12" y2="22"></line><line x1="2" y1="12" x2="5" y2="12"></line><line x1="19" y1="12" x2="22" y2="12"></line></svg>가까운 스팟 찾기</button>
        </div>
      </div>
    </div>
  </section>

  <section class="spots-section" id="spots">
    <div class="section-inner">
      <div class="section-head"><div class="section-head-copy"><h2>전국 서핑 스팟</h2><p>지도로 위치를 보고, 카드에서 오늘의 컨디션을 비교해보세요.</p></div><button class="btn btn-outline spot-fav-filter" id="favToggleBtn">즐겨찾기 스팟</button></div>
      <div class="status-bar" id="statusBar" style="display:none"></div>
      <div class="spots-layout">
        <div class="map-wrap">
          <div id="map"></div>
          <div class="map-toolbar" id="mapToolbar">
            <div class="map-tool-group">
              <button type="button" class="map-tool-btn" id="mapZoomInBtn" aria-label="지도 확대" title="확대"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
              <button type="button" class="map-tool-btn" id="mapZoomOutBtn" aria-label="지도 축소" title="축소"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
            </div>
            <button type="button" class="map-tool-btn map-tool-standalone" id="mapLocateBtn" aria-label="내 위치로 이동" title="내 위치와 날씨 보기"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><line x1="12" y1="2" x2="12" y2="5"></line><line x1="12" y1="19" x2="12" y2="22"></line><line x1="2" y1="12" x2="5" y2="12"></line><line x1="19" y1="12" x2="22" y2="12"></line></svg></button>
          </div>
          <div class="map-legend"><span><i class="dot good"></i>좋음</span><span><i class="dot fair"></i>보통</span><span><i class="dot poor"></i>나쁨</span></div>
        </div>
        <div class="cards-wrap">
          <div class="cards-toolbar"><div class="cards-count" id="cardsCount">전국 스팟 18곳</div></div>
          <div class="cards-grid" id="cardsGrid"></div>
          <div class="cards-pagination" id="cardsPagination"></div>
        </div>
      </div>
    </div>
  </section>
  <footer class="site-footer"><p>파고와 바람 예보를 바탕으로 오늘의 서핑 컨디션을 안내합니다.</p></footer>
</main>
